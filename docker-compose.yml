services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - nastroblu_mongo:/data/db
    environment:
      MONGO_INITDB_DATABASE: nastroblu

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/nastroblu
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nastroblu.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://nastroblu.in,https://www.nastroblu.in}
      NODE_ENV: production
    ports:
      - "127.0.0.1:4100:4000"
    # Serve live files from host so storefront/admin updates apply without rebuild
    volumes:
      - ./admin:/app/admin:ro
      - ./assets:/app/assets
      - ./index.html:/app/index.html:ro
      - ./about.html:/app/about.html:ro
      - ./product.html:/app/product.html:ro
      - ./account.html:/app/account.html:ro
      - ./terms.html:/app/terms.html:ro
      - ./privacy.html:/app/privacy.html:ro
      - ./shipping.html:/app/shipping.html:ro
      - ./returns.html:/app/returns.html:ro
      - ./disclaimer.html:/app/disclaimer.html:ro
      - ./food-safety.html:/app/food-safety.html:ro
      - ./robots.txt:/app/robots.txt:ro
      - ./styles.css:/app/styles.css:ro
      - ./app.js:/app/app.js:ro
      - ./account.js:/app/account.js:ro
      - ./products.js:/app/products.js:ro
      - ./shared.js:/app/shared.js:ro
      - ./product-page.js:/app/product-page.js:ro
      - ./todays-special.js:/app/todays-special.js:ro
      - ./google-reviews.js:/app/google-reviews.js:ro
      - ./delivery-info.js:/app/delivery-info.js:ro
      - ./wishlist.js:/app/wishlist.js:ro
      - ./server/src:/app/server/src:ro

volumes:
  nastroblu_mongo:
