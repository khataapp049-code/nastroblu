services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - nastroblu_mongo:/data/db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nastroblu

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/nastroblu
      JWT_SECRET: ${JWT_SECRET:-change-me-nastroblu-super-secret-key}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nastroblu.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-NastroBlu@Admin2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      NODE_ENV: production
    ports:
      - "4000:4000"

  # Optional Nginx on host is preferred for SSL on Hostinger VPS.
  # This nginx service is for local/docker-only testing.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  nastroblu_mongo:
