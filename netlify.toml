[build]
  publish = "."
  command = "echo 'Nastro Blu static storefront'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/product"
  to = "/product.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# Keep www → apex once domain is connected on Netlify
[[redirects]]
  from = "https://www.nastroblu.in/*"
  to = "https://nastroblu.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://nastroblu-backend.onrender.com/api/:splat"
  status = 200
  force = true
