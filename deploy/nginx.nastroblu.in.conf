server {
  listen 80;
  server_name nastroblu.in www.nastroblu.in;

  client_max_body_size 5m;

  # Security headers (Certbot SSL server block should include the same)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self' https://wa.me https://api.whatsapp.com" always;

  # Defence-in-depth: never proxy server source / deploy / secrets
  location ~* ^/(server|deploy|node_modules|\.git)(/|$) { return 404; }
  location ~* ^/(docker-compose[^/]*\.ya?ml|Dockerfile|package(-lock)?\.json|\.env)$ { return 404; }
  location ~* \.(md|sh|ya?ml|env|log)$ { return 404; }

  location /api/ {
    proxy_pass http://127.0.0.1:4100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:4100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
